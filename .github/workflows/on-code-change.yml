# This workflow is triggered every time a change is pushed to any branches
# Github actions command reference: https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: On Code Change (PR)

# The workflow could also be triggered on PRs
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  update-signature:
    name: Update module signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/update-signature@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  static-analysis:
    name: Static Analysis (linting, vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Jahia/jahia-modules-action/static-analysis@v2
        with:
          node_version: 12
          auditci_level: critical

  build:
    # TEMPORARY. This module's parent is org.jahia.modules:jahia-modules 8.2.0.0, which the image
    # on main does NOT warm, so its build resolves that parent from the repository every time. The
    # census proposes warming it. The two legs differ only in the image, and run together from one
    # commit, so the runner and the moment are the same for both:
    #   baseline: the image main publishes today   -> 8.2.0.0 absent, resolved during the build
    #   census:   the same image the census warms  -> 8.2.0.0 already in /root/.m2
    # Both are resolute, so the base image is not part of the difference. Read two numbers:
    # Initialize containers, which is what the larger cache costs, and the build step, which is
    # what it saves.
    name: Build Module (${{ matrix.label }})
    needs: update-signature
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            image: ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-resolute-mvn-loaded
            suffix: ""
          - label: census
            image: ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-resolute-mvn-loaded-pr-39
            suffix: "-census"
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/build@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          # The baseline leg keeps the default name, so the Sonar job below still finds it.
          github_artifact_suffix: ${{ matrix.suffix }}

  sonar-analysis:
    name: Sonar Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/sonar-analysis@v2
        with:
          primary_release_branch: main
          github_pr_id: ${{github.event.number}}
          sonar_url: ${{ secrets.SONAR_URL }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}